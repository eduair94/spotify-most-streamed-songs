name: Tests

on:
  push:
    paths-ignore:
      - "data/**"
      - "LEADERBOARD.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    # 24.04 rather than ubuntu-latest: setup-python has Python 3.9 builds for it, and the README
    # promises 3.9 or newer.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Validate tracks.txt
        run: python -m tracker check

      - name: Run the offline tests
        run: python -m pytest
