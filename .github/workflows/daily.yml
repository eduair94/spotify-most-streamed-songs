name: Daily update
# Records the daily play counts at 10:07 UTC and commits data/ and LEADERBOARD.md back to main.
# Runs the tracker once a day and commits data/, LEADERBOARD.md and README.md back to main.

on:
  schedule:
    # Once a day at 10:07 UTC, just after the time of day the first snapshot was read
    # (2026-11-01, 10:03 to 10:05 UTC), so that consecutive snapshots are about a day apart.
    # GitHub may start scheduled runs some minutes late.
    - cron: "7 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  key:
    name: Look for the API key
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          SPOTIFY_API_KEY: ${{ secrets.SPOTIFY_API_KEY }}
        run: |
          if [ -n "$SPOTIFY_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Daily update skipped::The SPOTIFY_API_KEY repository secret is not set, so there is nothing to fetch. Add it under Settings > Secrets and variables > Actions (see README.md); the next run will then record data."
          fi

  update:
    name: Fetch, record and render
    needs: key
    if: needs.key.outputs.present == 'true'
    runs-on: ubuntu-latest
    # The tracker starts no new request after 20 minutes (--time-limit) and keeps what it
    # fetched, so a slow API day ends well inside this limit.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch as it is now, not the commit that started the run: a queued run or a
          # re-run of an old one then builds on the data committed since, without conflicts.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: python -m pip install -r requirements.txt

      - name: Fetch today's play counts
        env:
          SPOTIFY_API_KEY: ${{ secrets.SPOTIFY_API_KEY }}
          SPOTIFY_API_BASE: ${{ secrets.SPOTIFY_API_BASE }}
          TRACKER_MAX_REQUESTS: ${{ vars.TRACKER_MAX_REQUESTS }}
        run: python -m tracker run

      - name: Commit the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data LEADERBOARD.md README.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "data: $(date -u +%Y-%m-%d) snapshot"
          if ! git pull --rebase; then
            git rebase --abort 2>/dev/null || true
            echo "::error title=Daily update not saved::The new data could not be added on top of the branch: its generated files changed during this run, or GitHub could not be reached. Run the workflow again."
            exit 1
          fi
          git push
