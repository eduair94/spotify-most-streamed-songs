# Settings for the tools only: the tracker runs with `python -m tracker`, it is not installed.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py39"

[tool.ruff.lint]
# Pinned, so that a newer ruff with more rules on by default checks the same things.
select = ["E", "F", "W", "I"]
